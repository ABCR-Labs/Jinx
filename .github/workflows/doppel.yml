# Example workflow for a repository that wants Doppel comments on new PRs.
name: doppel
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin to a release tag once published; `./` works when this repo itself is the action.
      - uses: actions/checkout@v4
      - uses: ./
        with:
          threshold: ""
