name: Jinx
description: Comment on new pull requests that likely duplicate an open PR (tuned for coding-agent PRs). No LLM, no API keys.
branding:
  icon: copy
  color: blue
inputs:
  github-token:
    description: Token used to read open PRs and post one comment
    default: ${{ github.token }}
  threshold:
    description: Minimum score (0-1) to post a comment. Empty = bundled default
    default: ""
  max-open-prs:
    description: Max number of open PRs to compare against
    default: "200"
  top:
    description: Max matches listed in the comment
    default: "3"
  embed:
    description: Also use the local MiniLM text model (runs on the runner CPU, no API). "false" = lexical signals only
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: |
        if [ "${{ inputs.embed }}" = "true" ]; then pip install --quiet "${{ github.action_path }}[embed]"; else pip install --quiet "${{ github.action_path }}"; fi
    - shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_MAX_OPEN_PRS: ${{ inputs.max-open-prs }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_EMBED: ${{ inputs.embed }}
      run: python -m jinx_pr.action
